[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiberlabs-benchmarks"
version = "0.1.0"
description = "Reproducible Python 3.11+ throughput, latency, SQLite WAL concurrency, and 100+ payload Red-Team security benchmark harness for KiberLabs automation engines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KiberLabs Engineering", email = "noreply@kiberlabs.github.io" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kiberlabs-bench = "kiberlabs_bench.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
